services:
  - type: web
    name: fiqa-ri-epn
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m nltk.downloader -d assets/nltk_data stopwords && python preparar.py modelo
    startCommand: gunicorn --workers 1 --threads 1 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: NLTK_DATA
        value: assets/nltk_data
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
